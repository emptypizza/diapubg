name: Verify

on:
  pull_request:
  workflow_dispatch:
    inputs:
      url:
        description: "Optional deployed DIAPUBG URL"
        type: string

permissions:
  contents: read

jobs:
  playtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DIAPUBG_TEST_URL: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Prepare Chromium
        run: |
          if browser_path=$(command -v google-chrome); then
            printf 'DIAPUBG_CHROME=%s\n' "$browser_path" >> "$GITHUB_ENV"
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - if: ${{ !inputs.url }}
        run: pnpm test:e2e
      - if: ${{ inputs.url }}
        run: pnpm test:e2e --grep "reconnects as the same guest"
